name: Bootstrap lockfile and check
on:
  push:
    branches: [chore/supabase-ssr-bootstrap]
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate package-lock.json
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: lock Next.js and Supabase dependencies"
            git push origin HEAD:chore/supabase-ssr-bootstrap
          fi
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://gczribbtkfvhpzzupqre.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_aYKHppmiQFfAdoUVzI7YXg_rlpvSzW2
      - run: npm run typecheck
