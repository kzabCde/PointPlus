name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Configure public Supabase environment
        run: cp .env.example .env.local
      - name: Validate PointPlus artwork
        run: node scripts/validate-point-plus-assets.mjs
      - name: Verify M01 foundation
        run: npm run test:foundation
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
